<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - Pastelería Artesanal</title>
  <!-- Fuentes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- CSS tiquitito-->
  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">


</head>
<body>

  <!-- navbar bonito -->
    <div id="header-container"></div>

    <main>
        <section id="login" class="section active">
        <div class="login-container">
        <div class="card-box">
          <div class="section-header" style="margin-bottom: 1.5rem;">
            <h2>Bienvenido a Creamy</h2>
            <p>Ingresa a tu cuenta para ver tus pedidos</p>
          </div>
          <form id="form-login" novalidate>
            <div class="form-group">
              <label for="log-email">Correo Electrónico</label>
              <input type="email" id="log-email" required placeholder="tu@correo.com">
              <div class="invalid-feedback" id="error-log-email"></div>
            </div>
            <div class="form-group">
              <label for="log-pass">Contraseña</label>
              <input type="password" id="log-pass" required placeholder="••••••••">
              <div class="invalid-feedback" id="error-log-pass"></div>
            </div>
            <div id="mensaje-login" class="mb-3"></div>
            <button type="submit" class="btn btn-primary full-width">Iniciar Sesión</button>
          </form>
          <p></p>
          <a>¿No tienes una cuenta?</a>
          <a href="registro.html" class="nav-link">Registrate aqui</a>
        </div>
        </div>
        </section>

    </main>
    <div id="footer-container"></div>
    <!-- Scripts JS diosito por favor acompañame -->
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/validacion-login.js"></script>
</body>

</html>
