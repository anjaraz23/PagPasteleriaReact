<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - Pastelería Artesanal</title>
  <!-- Fuentes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- CSS tiquitito-->
  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contacto.css">

</head>
<body>

  <!-- navbar bonito -->
    <div id="header-container"></div>

    <main>
        <section id="contacto" class="section active">
      <div class="section-header">
        <h2>Contacto</h2>
        <p>Estamos listos para endulzar tus dudas</p>
      </div>
      <div class="split-container">
        <div class="card-box">
          <form id="form-contacto">
            <div class="form-group">
              <label for="con-nombre">Nombre</label>
              <input type="text" id="con-nombre" required placeholder="Tu nombre">
            </div>
            <div class="form-group">
              <label for="con-email">Correo Electrónico</label>
              <input type="email" id="con-email" required placeholder="hola@ejemplo.com">
            </div>
            <div class="form-group">
              <label for="con-mensaje">Mensaje</label>
              <textarea id="con-mensaje" rows="4" placeholder="¿En qué te podemos ayudar?" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary full-width">Enviar Mensaje</button>
          </form>
        </div>
        <div class="info-stack">
          <div class="info-card">
            <h4>📍 Dónde encontrarnos</h4>
            <p>Av. Dulzura 770, Providencia, Santiago</p>
          </div>
          <div class="info-card">
            <h4>⏰ Horario de Atención</h4>
            <p>Lunes a Sábado: 09:30 - 19:00 <br>Domingos: 10:00 - 15:00</p>
          </div>
          <div class="info-card">
            <h4>💌 Escríbenos directamente</h4>
            <p>contacto@creamy.com<br>+56 9 1234 5678</p>
          </div>
        </div>
      </div>
    </section>

    </main>
    <div id="footer-container"></div>
    <!-- Scripts JS diosito por favor acompañame -->
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/sesion-activa.js"></script>
    <script src="scripts/carrito.js"></script>
</body>

</html>
