<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas - Pastelería Artesanal</title>
  <!-- Fuentes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- CSS tiquitito-->
  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/registro.css">

</head>
<body>

  <!-- navbar bonito -->
    <div id="header-container"></div>

    <main>
    <section id="register" class="section active">
      <div class="registro-container">
        <div class="card-box">
          <div class="section-header" style="margin-bottom: 1.5rem;">
            <h2>Bienvenido a Creamy</h2>
            <p>Registra tu cuenta para ver tus pedidos</p>
          </div>
          <form id="form-registro" novalidate>
            <div class="form-group">
              <label for="run" class="form-label">RUN</label>
              <input type="text" class="form-control" id="run" name="run"
                placeholder="Ej: 224459971" maxlength="9" required>
              <div class="form-text">Sin puntos ni guion.</div>
              <div class="invalid-feedback" id="error-run"></div>
            </div>
            <div class="form-group">
               <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre"
                  maxlength="50" required>
                <div class="invalid-feedback" id="error-nombre"></div>
            </div>
            <div class="form-group">
              <label for="apellidos" class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="apellidos" name="apellidos"
                maxlength="100" required>
              <div class="invalid-feedback" id="error-apellidos"></div>
            </div>
            <div class="form-group">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="correo" name="correo"
                maxlength="100" placeholder="nombre@duoc.cl" required>
              <div class="form-text">Solo correos @duocuc.cl, @profesor.duocuc.cl o @gmail.com</div>
              <div class="invalid-feedback" id="error-correo"></div>
            </div>
            <div class="form-group">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" name="password"
                minlength="4" maxlength="10" required>
              <div class="form-text">Entre 4 y 10 caracteres, alfanumérica con caracteres especiales</div>
              <div class="invalid-feedback" id="error-password"></div>
            </div>
            <div class="form-group">
              <label for="password2" class="form-label">Confirmar contraseña</label>
              <input type="password" class="form-control" id="password2" name="password2"
               minlength="4" maxlength="10" required>
              <div class="invalid-feedback" id="error-password2"></div>
            </div>
            <div class="form-group">
              <label for="fecha-nacimiento" class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control" id="fecha-nacimiento" name="fecha-nacimiento">
              <div class="form-text">Opcional</div>
              <div class="invalid-feedback" id="error-fecha-nacimiento"></div>
            </div>
            <div class="form-group">
              <label for="region" class="form-label">Región</label>
              <select class="form-select" id="region" name="region" required>
              <option value="" selected disabled>Seleccione una región</option>
              </select>
              <div class="invalid-feedback" id="error-region"></div>
            </div>
            <div class="form-group">
              <label for="comuna" class="form-label">Comuna</label>
              <select class="form-select" id="comuna" name="comuna" required disabled>
              <option value="" selected disabled>Seleccione primero una región</option>
              </select>
              <div class="invalid-feedback" id="error-comuna"></div>
            </div>
            <div class="form-group">
              <label for="direccion" class="form-label">Dirección</label>
              <textarea class="form-control" id="direccion" name="direccion"
                rows="2" maxlength="300" required></textarea>
              <div class="invalid-feedback" id="error-direccion"></div>
            </div>
            
            <div id="mensaje-general" class="mb-3"></div>

            <div class="registro-botones">
                    <button type="submit" class="btn-registro btn btn-primary full-width">Crear mi cuenta</button>
              </div>
            
          </form>
        </div>
      </div>
    </section>

    </main>
    <div id="footer-container"></div>
    <!-- Scripts JS diosito por favor acompañame -->
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/validacion-registro.js"></script>
    <script src="scripts/script.js"></script>

</body>

</html>
